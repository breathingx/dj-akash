<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Akash - Admin Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --gold: #d4af37;
            --dark: #121212;
            --light-dark: #1e1e1e;
            --text: #ffffff;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--dark);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--light-dark);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }
        h2 {
            color: var(--gold);
            text-align: center;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input:focus, textarea:focus {
            border-color: var(--gold);
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--gold);
            color: #000;
            border: none;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }
        button:hover {
            background-color: #bfa030;
        }
        .hidden { display: none !important; }
        .logout-btn {
            background-color: #c0392b;
            color: white;
            margin-top: 10px;
        }
        .logout-btn:hover { background-color: #a33226; }
        .status-msg { text-align: center; margin-top: 10px; color: var(--gold); }
    </style>
</head>
<body>

    <div id="login-section" class="container">
        <h2>DJ Akash Admin Login</h2>
        <form id="login-form">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="login-email" required placeholder="admin@dj-akash.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" required placeholder="••••••••">
            </div>
            <button type="submit">Log In</button>
        </form>
        <div id="login-msg" class="status-msg"></div>
    </div>

    <div id="dashboard-section" class="container hidden" style="max-width: 800px;">
        <div style="display: flex; gap: 40px; flex-wrap: wrap;">
            
            <div style="flex: 1; min-width: 300px;">
                <h2>Add New Event</h2>
                <form id="event-form">
                    <div class="form-group">
                        <label>Event Name</label>
                        <input type="text" id="event-name" required placeholder="e.g., Karaoke Night">
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="event-desc" rows="3" required placeholder="Event details..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="event-date" required>
                    </div>
                    <div class="form-group">
                        <label>Time</label>
                        <input type="time" id="event-time" required>
                    </div>
                    <div class="form-group">
                        <label>Location</label>
                        <input type="text" id="event-location" required placeholder="e.g., SVH Den Haag">
                    </div>
                    <div class="form-group">
                        <label>Event Flyer (Single Image)</label>
                        <input type="file" id="event-flyer" accept="image/*" required>
                    </div>
                    <button type="submit" id="submit-btn">Publish Event</button>
                </form>
                <div id="upload-msg" class="status-msg"></div>
                <button class="logout-btn" id="logout-btn">Log Out</button>
            </div>

          <div style="flex: 1; min-width: 300px; border-left: 1px solid #333; padding-left: 20px;">
                <h2>Manage Past Events Gallery</h2>
                <p style="font-size: 14px; color: #aaa;">Select an event below to manage or upload photos:</p>
                
                <div class="form-group">
                    <label>1. Select Event</label>
                    <select id="event-selector" style="width: 100%; padding: 10px; background: #2a2a2a; color: white; border: 1px solid #444; border-radius: 4px;">
                        <option value="">-- Loading Events --</option>
                    </select>
                </div>

                <form id="gallery-form">
                    <div class="form-group">
                        <label>2. Upload New Photos</label>
                        <input type="file" id="gallery-files" accept="image/*" multiple required disabled>
                    </div>
                    <button type="submit" id="gallery-submit-btn" disabled>Upload to Gallery</button>
                </form>
                <div id="gallery-msg" class="status-msg"></div>

                <div style="margin-top: 30px;">
                    <label style="margin-bottom: 10px; display: block;">Current Event Photos (Click red X to delete)</label>
                    <div id="admin-photo-stream" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; background: #1a1a1a; padding: 10px; border-radius: 4px; min-height: 50px;">
                        <p style="color: #666; font-size: 13px; text-align: center; grid-column: 1/-1; margin: 10px 0;">Select an event above to view photos.</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const SUPABASE_URL = 'https://fiibrecmehhebuthkvcz.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_037d9RVXZEJAFuL0eiXSyQ_gx5l6gWt'; 

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // DOM Elements
        const loginSection = document.getElementById('login-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const loginForm = document.getElementById('login-form');
        const eventForm = document.getElementById('event-form');
        const logoutBtn = document.getElementById('logout-btn');
        const loginMsg = document.getElementById('login-msg');
        const uploadMsg = document.getElementById('upload-msg');
        
        const eventSelector = document.getElementById('event-selector');
        const galleryForm = document.getElementById('gallery-form');
        const galleryFiles = document.getElementById('gallery-files');
        const gallerySubmitBtn = document.getElementById('gallery-submit-btn');
        const galleryMsg = document.getElementById('gallery-msg');
        const adminPhotoStream = document.getElementById('admin-photo-stream');

        // Check Session
        async function checkUser() {
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session) { showDashboard(); } else { showLogin(); }
            } catch (err) { console.error(err); }
        }
        checkUser();

        // Listen for Event Selector changes
        eventSelector.addEventListener('change', () => {
            const eventId = eventSelector.value;
            if (eventId) {
                galleryFiles.disabled = false;
                gallerySubmitBtn.disabled = false;
                loadCurrentEventPhotos(eventId); // Load photos when selected
            } else {
                galleryFiles.disabled = true;
                gallerySubmitBtn.disabled = true;
                adminPhotoStream.innerHTML = `<p style="color: #666; font-size: 13px; text-align: center; grid-column: 1/-1; margin: 10px 0;">Select an event above to view photos.</p>`;
            }
        });

        // Load current photos for selected event inside Admin panel
        async function loadCurrentEventPhotos(eventId) {
            adminPhotoStream.innerHTML = '<p style="color: #aaa; font-size: 13px; text-align: center; grid-column: 1/-1;">Loading photos...</p>';
            
            const { data: photos, error } = await supabaseClient
                .from('event_images')
                .select('id, image_url')
                .eq('event_id', eventId);

            if (error) {
                adminPhotoStream.innerHTML = '<p style="color: red; font-size: 13px;">Error loading images.</p>';
                return;
            }

            if (!photos || photos.length === 0) {
                adminPhotoStream.innerHTML = '<p style="color: #555; font-size: 13px; text-align: center; grid-column: 1/-1; margin: 10px 0;">No photos uploaded yet.</p>';
                return;
            }

            adminPhotoStream.innerHTML = '';
            photos.forEach(photo => {
                const wrapper = document.createElement('div');
                wrapper.style.position = 'relative';
                wrapper.style.aspectRatio = '1/1';
                
                wrapper.innerHTML = `
                    <img src="${photo.image_url}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 4px;">
                    <button type="button" onclick="deletePhoto(${photo.id}, '${photo.image_url}')" style="position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; padding: 0; background: rgba(192, 57, 43, 0.9); color: white; border-radius: 50%; font-size: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; box-shadow: 0 1px 4px rgba(0,0,0,0.5);">✕</button>
                `;
                adminPhotoStream.appendChild(wrapper);
            });
        }

        // Handle Photo Deletion
        window.deletePhoto = async function(photoId, imageUrl) {
            if (!confirm("Are you sure you want to delete this photo permanently?")) return;

            try {
                // 1. Delete image file reference from storage bucket
                // Extract filename from public URL (everything after /public/)
                const urlParts = imageUrl.split('/public/');
                if (urlParts.length > 1) {
                    const storagePath = `public/${urlParts[1]}`;
                    await supabaseClient.storage.from('gallery').remove([storagePath]);
                }

                // 2. Delete row database reference
                const { error: dbErr } = await supabaseClient
                    .from('event_images')
                    .delete()
                    .eq('id', photoId);

                if (dbErr) throw dbErr;

                // 3. Refresh live view
                loadCurrentEventPhotos(eventSelector.value);
            } catch (err) {
                alert("Failed to delete image: " + err.message);
            }
        };

        // Load Events into selector
        async function fetchEventsForSelector() {
            const { data: events, error } = await supabaseClient
                .from('events')
                .select('id, name, event_date')
                .order('event_date', { ascending: false });

            if (!error && events) {
                eventSelector.innerHTML = '<option value="">-- Choose an Event --</option>';
                events.forEach(evt => {
                    const opt = document.createElement('option');
                    opt.value = evt.id;
                    opt.textContent = `${evt.event_date} - ${evt.name}`;
                    eventSelector.appendChild(opt);
                });
            }
        }

        // Login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginMsg.textContent = "Logging in...";
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) { loginMsg.textContent = "Error: " + error.message; } 
            else { loginMsg.textContent = ""; showDashboard(); }
        });

        // Logout
        logoutBtn.addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            showLogin();
        });

        // Publish Event Form
        eventForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            uploadMsg.textContent = "Publishing event...";

            try {
                const name = document.getElementById('event-name').value;
                const description = document.getElementById('event-desc').value;
                const event_date = document.getElementById('event-date').value;
                const event_time = document.getElementById('event-time').value;
                const location = document.getElementById('event-location').value;
                
                const flyerFile = document.getElementById('event-flyer').files[0];
                const fileExt = flyerFile.name.split('.').pop();
                const fileName = `${Date.now()}.${fileExt}`;
                const filePath = `public/${fileName}`;

                const { error: uploadError } = await supabaseClient.storage.from('flyers').upload(filePath, flyerFile);
                if (uploadError) throw uploadError;

                const { data: urlData } = supabaseClient.storage.from('flyers').getPublicUrl(filePath);
                const flyer_url = urlData.publicUrl;

                const { error: insertError } = await supabaseClient
                    .from('events')
                    .insert([{ name, description, event_date, event_time, location, flyer_url }]);
                if (insertError) throw insertError;

                uploadMsg.textContent = "✨ Event Published Successfully!";
                eventForm.reset();
                fetchEventsForSelector();
            } catch (err) {
                uploadMsg.textContent = "Error: " + err.message;
            } finally {
                submitBtn.disabled = false;
            }
        });

        // Handle Multiple Gallery Image Uploads
        galleryForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            gallerySubmitBtn.disabled = true;
            const eventId = eventSelector.value;
            const files = galleryFiles.files;

            try {
                for(let i = 0; i < files.length; i++) {
                    const file = files[i];
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${eventId}_${Date.now()}_${i}.${fileExt}`;
                    const filePath = `public/${fileName}`;

                    const { error: storageErr } = await supabaseClient.storage.from('gallery').upload(filePath, file);
                    if (storageErr) throw storageErr;

                    const { data: urlData } = supabaseClient.storage.from('gallery').getPublicUrl(filePath);
                    const image_url = urlData.publicUrl;

                    const { error: dbErr } = await supabaseClient
                        .from('event_images')
                        .insert([{ event_id: eventId, image_url: image_url }]);
                    if (dbErr) throw dbErr;
                }

                galleryMsg.textContent = "✨ All photos uploaded successfully!";
                galleryForm.reset();
                loadCurrentEventPhotos(eventId); // Instantly reload photo stream layout
            } catch (err) {
                galleryMsg.textContent = "Error: " + err.message;
            } finally {
                gallerySubmitBtn.disabled = false;
            }
        });

        function showDashboard() {
            loginSection.classList.add('hidden');
            dashboardSection.classList.remove('hidden');
            fetchEventsForSelector();
        }
        function showLogin() {
            loginSection.classList.remove('hidden');
            dashboardSection.classList.add('hidden');
        }
    </script>
</body>
</html>
