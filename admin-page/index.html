<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Akash - Admin Panel</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="login-section" class="container">
        <h2>DJ Akash Admin Login</h2>

        <form id="login-form">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="login-email" required placeholder="example@example.example">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" required placeholder="••••••••">
            </div>

            <button type="submit">Log In</button>
        </form>

        <div id="login-msg" class="status-msg"></div>
    </div>


    <div id="dashboard-section" class="container hidden" style="max-width: 900px;">

        <div style="display: flex; gap: 40px; flex-wrap: wrap;">

            <!-- ADD EVENT -->
            <div style="flex: 1; min-width: 300px;">

                <h2>Add New Event</h2>

                <form id="event-form">

                    <div class="form-group">
                        <label>Event Name</label>
                        <input type="text" id="event-name" required placeholder="e.g., Karaoke Night">
                    </div>

                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="event-desc" rows="3" placeholder="Event details..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="event-date" required>
                    </div>

                    <div class="form-group">
                        <label>Time</label>
                        <input type="time" id="event-time" required>
                    </div>

                    <div class="form-group">
                        <label>Location</label>
                        <input type="text" id="event-location" required placeholder="e.g., SVH Den Haag">
                    </div>

                    <div class="form-group">
                        <label>Event Flyer (Single Image)</label>
                        <input type="file" id="event-flyer" accept="image/*" required>
                    </div>

                    <button type="submit" id="submit-btn">
                        Publish Event
                    </button>

                </form>

                <div id="upload-msg" class="status-msg"></div>

                <button class="logout-btn" id="logout-btn">
                    Log Out
                </button>

            </div>


            <!-- EDIT EVENTS -->
            <div style="flex: 1; min-width: 300px; border-left: 1px solid #333; padding-left: 20px;">

                <h2>Edit Existing Events</h2>

                <p style="font-size: 14px; color: #aaa;">
                    Select an event below to change its details:
                </p>

                <div class="form-group">

                    <label>1. Select Event</label>

                    <select id="edit-event-selector">
                        <option value="">-- Loading Events --</option>
                    </select>

                </div>


                <form id="edit-event-form">

                    <fieldset id="edit-fieldset" disabled>

                        <div class="form-group">
                            <label>2. Event Name</label>
                            <input type="text" id="edit-event-name" required>
                        </div>

                        <div class="form-group">
                            <label>Description</label>
                            <textarea id="edit-event-desc" rows="3"></textarea>
                        </div>

                        <div class="form-group">
                            <label>Date</label>
                            <input type="date" id="edit-event-date" required>
                        </div>

                        <div class="form-group">
                            <label>Time</label>
                            <input type="time" id="edit-event-time" required>
                        </div>

                        <div class="form-group">
                            <label>Location</label>
                            <input type="text" id="edit-event-location" required>
                        </div>

                        <div class="form-group">
                            <label>Event Flyer</label>
                            <div id="edit-flyer-wrap" class="hidden">
                                <img id="edit-flyer-preview" alt="Current flyer">
                                <button type="button" id="edit-flyer-delete" class="photo-delete-btn" title="Delete flyer">✕</button>
                            </div>
                            <p id="edit-no-flyer" class="empty-photo-message hidden">No flyer uploaded.</p>
                            <label style="font-weight: normal; font-size: 13px; color: #aaa;">
                                Upload a new flyer (replaces the current one)
                            </label>
                            <input type="file" id="edit-event-flyer" accept="image/*">
                        </div>

                        <button type="submit" id="edit-submit-btn">
                            Save Changes
                        </button>

                    </fieldset>

                </form>

                <div id="edit-msg" class="status-msg"></div>


                <!-- PHOTOS -->
                <div style="margin-top: 30px; border-top: 1px solid #333; padding-top: 20px;">

                    <form id="gallery-form">

                        <div class="form-group">

                            <label>3. Add Photos to This Event</label>

                            <input
                                type="file"
                                id="gallery-files"
                                accept="image/*"
                                multiple
                                required
                                disabled
                            >

                        </div>

                        <button type="submit" id="gallery-submit-btn" disabled>
                            Upload to Gallery
                        </button>

                    </form>

                    <div id="gallery-msg" class="status-msg"></div>


                    <div style="margin-top: 30px;">

                        <label style="margin-bottom: 10px; display: block;">
                            Current Event Photos (Click red X to delete)
                        </label>

                        <div id="admin-photo-stream">

                            <p class="empty-photo-message">
                                Select an event above to view photos.
                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
